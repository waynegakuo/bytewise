<section class="storefront">
  <header class="storefront-intro">
    <p class="eyebrow">ByteWise Gadgets</p>
    <h1>Smart tech, one stop</h1>
    <p class="lede">Browse the catalog, or ask the assistant to find a gadget that fits.</p>
  </header>

  <div class="products-grid">
    @for (product of products; track product.id) {
      <app-product-card [product]="product"></app-product-card>
    }
  </div>
</section>
