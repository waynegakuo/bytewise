<div class="assistant">
  <button
    type="button"
    class="fab"
    (click)="toggleWindow()"
    [class.active]="isOpen()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="isOpen() ? 'Close shopping assistant' : 'Open shopping assistant'"
  >
    <span class="material-icons">{{ isOpen() ? 'close' : 'smart_toy' }}</span>
  </button>

  @if (isOpen()) {
    <div class="backdrop" (click)="toggleWindow()" aria-hidden="true"></div>

    <section class="panel" role="dialog" aria-label="ByteWise Assistant">
      <header class="panel-header">
        <div class="identity">
          <span class="identity-icon material-icons" aria-hidden="true">smart_toy</span>
          <div>
            <h2>ByteWise Assistant</h2>
            <p>{{ isListening() ? 'Listening…' : 'Ask about any gadget' }}</p>
          </div>
        </div>
        <button type="button" class="icon-btn" (click)="toggleWindow()" aria-label="Close assistant">
          <span class="material-icons">close</span>
        </button>
      </header>

      <div class="messages">
        @for (message of messageHistory(); track $index) {
          <div class="message" [class.user]="message.isUser" [class.agent]="!message.isUser">
            @if (message.isUser) {
              <p class="bubble">{{ message.text }}</p>
            } @else {
              <div class="bubble markdown" [innerHTML]="message.text | markdown"></div>
            }
          </div>
        }
        @if (isThinking()) {
          <div class="message agent">
            <p class="bubble thinking" aria-label="Assistant is thinking">
              <span></span>
              <span></span>
              <span></span>
            </p>
          </div>
        }
      </div>

      <form class="composer" (submit)="onSubmit($event)">
        <input
          type="text"
          name="message"
          [(ngModel)]="userInput"
          placeholder="Ask about a product…"
          autocomplete="off"
          aria-label="Message the assistant"
        />
        <button
          type="button"
          class="icon-btn mic"
          (click)="toggleVoiceRecognition()"
          [class.listening]="isListening()"
          [attr.aria-label]="isListening() ? 'Stop listening' : 'Speak a question'"
        >
          <span class="material-icons">{{ isListening() ? 'mic' : 'mic_none' }}</span>
        </button>
        <button type="submit" class="icon-btn send" aria-label="Send message">
          <span class="material-icons">send</span>
        </button>
      </form>
    </section>
  }
</div>
