<nav class="navbar" aria-label="Store">
  <a routerLink="/" class="logo" aria-label="ByteWise home">
    <img
      class="logo-image"
      ngSrc="/bytewise.svg"
      height="40"
      width="128"
      priority
      alt="ByteWise"
    >
  </a>

  <div class="cart">
    <span class="cart-icon" aria-hidden="true">
      <i class="material-icons">shopping_cart</i>
      @if (productService.cartItemCount() > 0) {
        <span class="cart-badge">{{ productService.cartItemCount() }}</span>
      }
    </span>
    <span class="cart-label">Cart</span>
    @if (productService.cartItemCount() > 0) {
      <span class="cart-total">
        {{ productService.productCartTotal() | currency: 'KES ': 'symbol' : '1.0-0' }}
      </span>
      <button type="button" class="clear-cart-btn" (click)="clearCart()">
        Clear
      </button>
    }
  </div>
</nav>
